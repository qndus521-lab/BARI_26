# The first robot whose local IR reaches the gap broadcasts a bounded-hop beacon.
environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 1000
  latent_sigma: 0.0
  beacon:
    enabled: true
    communication_range: 2.5
    max_hops: 4
  reward:
    beacon_discovery_reward: 0.5
    beacon_gather_delta: 0.15
model:
  architecture: structured_mappo
  branch_hidden: 48
  fused_hidden: 64
  recurrent_hidden: 64
  film: true
  use_heterogeneity: false
training:
  total_updates: 1000
  rollout_steps: 400
  learning_rate: 0.0003
  entropy_coef: 0.02
  auxiliary_coef: 0.1
  critic: graph
  output_dir: runs/beacon_structured_mappo
